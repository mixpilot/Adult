{% extends 'base.html' %}

{% block title %}STK Push failed{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-exclamation-circle text-warning display-1 mb-3"></i>
            <h3>Couldn't send M-Pesa prompt</h3>
            <p class="text-muted mb-4">Try again with STK Push, or pay directly to our till instead.</p>
            <div class="d-grid gap-2">
                <a href="{{ review_url }}" class="btn btn-primary btn-lg">Try STK Push again</a>
                <a href="{% url 'subscriptions:plans' %}" class="btn btn-outline-secondary">Back to plans</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
